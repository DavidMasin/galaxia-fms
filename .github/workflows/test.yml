name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        # Three analyzers are off because unmodified upstream code trips them (unkeyed struct literals in
        # tests, IPv4-only host:port formatting, and a deliberately malformed struct tag in a test). They are
        # re-enabled as that code is reworked.
        run: go vet -composites=false -hostport=false -structtag=false ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  sdk:
    name: Device SDKs and examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install platformio paho-mqtt pytest gpiozero
      - name: Python SDK tests
        run: python -m pytest sdk/python
      - name: MicroPython SDK tests (under CPython, with stand-ins for the hardware)
        run: python -m pytest sdk/micropython/tests
      - name: Arduino library tests on the runner
        # The same ArduinoJson the library's examples build with (sdk/arduino/library.json).
        run: |
          git clone --quiet --depth 1 --branch v7.4.3 https://github.com/bblanchon/ArduinoJson.git \
            "$RUNNER_TEMP/ArduinoJson"
          python sdk/arduino/test/native/run_native_tests.py --arduinojson "$RUNNER_TEMP/ArduinoJson/src"
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('examples/build_all.py', 'examples/*/platformio.ini', 'sdk/arduino/library.json') }}
      - name: Build every example for the ESP32, with strict warnings
        run: python examples/build_all.py --strict --workspace "$RUNNER_TEMP/galaxia-build"

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
