openapi: 3.1.0
info:
  title: Galaxia FMS API
  version: "1"
  description: >
    The version 1 API of Galaxia FMS. Everything that happens on the field is also published as an event: poll
    /events, stream /events/stream (Server-Sent Events) or /events/ws (WebSocket), or have events sent to you with
    webhooks (docs/webhooks.md).


    Logins are off until the event has an admin password or a user; while they are off the whole API is open, like
    the displays. Once they are on, a request needs a login session or an API token sent as
    "Authorization: Bearer <token>" (made on Setup, Users and API Tokens). Any role may read; changing a game and
    everything about webhooks need the admin role. Without a login or token the answer is 401, and with a role
    that may not, 403. /time, /health, /openapi.yaml, /openapi.json and /auth are always open.


    The device routes under /devices are for field devices, which send their own device token instead; see
    docs/devices.md.
servers:
  - url: http://10.0.100.5:8080
    description: The field's FMS at its usual address
security:
  - {}
  - apiToken: []
  - session: []
paths:
  /api/v1/time:
    get:
      summary: The server's clock
      description: For measuring how far a display's or device's clock is from the server's.
      responses:
        "200":
          description: Current time
          content:
            application/json:
              schema:
                type: object
                required: [t, us, iso]
                properties:
                  t: {type: integer, description: UTC milliseconds since 1970}
                  us: {type: integer, description: The same moment in UTC microseconds since 1970}
                  iso: {type: string, format: date-time}
  /api/v1/health:
    get:
      summary: Whether the server is up and what it is doing
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                type: object
                required: [status, uptimeSec, game, matchState, lastEvent]
                properties:
                  status: {type: string, enum: [ok]}
                  uptimeSec: {type: integer}
                  game: {type: string, description: Id of the active game}
                  matchState: {$ref: "#/components/schemas/MatchState"}
                  lastEvent: {type: integer, description: Sequence number of the latest event}
  /api/v1/openapi.yaml:
    get:
      summary: This description
      responses:
        "200":
          description: The OpenAPI description in YAML
          content:
            application/yaml: {}
  /api/v1/openapi.json:
    get:
      summary: This description, as JSON
      responses:
        "200":
          description: The OpenAPI description in JSON
          content:
            application/json:
              schema: {type: object}
  /api/v1/auth:
    get:
      summary: Whether logins are needed, and who this request comes from
      description: For a program to check its token, and for pages to show who is logged in. Always open.
      responses:
        "200":
          description: The answer
          content:
            application/json:
              schema:
                type: object
                required: [required, identity]
                properties:
                  required: {type: boolean, description: Whether logins are on}
                  identity:
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [name, role, token]
                        properties:
                          name: {type: string, description: "The username, admin, or the name of the token"}
                          role: {$ref: "#/components/schemas/Role"}
                          token: {type: boolean, description: Identified by an API token rather than a login}
  /api/v1/game:
    get:
      summary: The active game
      description: >
        What browsers build scoring panels and displays from: alliances, stations, phases, elements, fouls, cards,
        breakdown rows, ranking points and layout hints. See docs/game-definition.md.
      responses:
        "200":
          description: The active game's view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GameView"}
        "401": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/match:
    get:
      summary: The match on the field now
      responses:
        "200":
          description: The current match, its clock and its live score
          content:
            application/json:
              schema:
                type: object
                required: [state, matchTimeSec, phaseIndex, phaseId, phaseTimeSec, phaseRemainingSec, score]
                properties:
                  match: {$ref: "#/components/schemas/MatchSummary"}
                  state: {$ref: "#/components/schemas/MatchState"}
                  matchTimeSec: {type: integer}
                  phaseIndex: {type: integer, description: Index into the game's phases, or -1 outside a match}
                  phaseId: {type: string}
                  phaseTimeSec: {type: integer}
                  phaseRemainingSec: {type: integer}
                  timeoutDurationSec: {type: integer}
                  countdown:
                    type: object
                    description: Present while the state is countdown and something is counted.
                    required: [t0, beats]
                    properties:
                      t0: {type: integer, description: When the match starts, in UTC milliseconds since 1970}
                      beats: {type: integer, description: How many beats are counted before it}
                  score:
                    type: object
                    description: The live score, in the shape of the realtimeScore message in docs/architecture.md
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/matches:
    get:
      summary: The matches of one type, with their results
      parameters:
        - name: type
          in: query
          schema: {type: string, enum: [practice, qualification, playoff], default: qualification}
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items: {$ref: "#/components/schemas/MatchSummary"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/matches/{id}:
    get:
      summary: One match with its full result and audit log
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: The match
          content:
            application/json:
              schema:
                type: object
                required: [match, changes]
                properties:
                  match: {$ref: "#/components/schemas/MatchSummary"}
                  computed:
                    type: [object, "null"]
                    description: The computed result (scoring.Result), recomputed from the stored raw state
                  state:
                    type: object
                    description: The stored raw state (scoring.State)
                  changes:
                    type: array
                    description: Every score change, including undo records
                    items: {$ref: "#/components/schemas/ScoreChange"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/rankings:
    get:
      summary: Qualification rankings
      responses:
        "200":
          description: Rankings, best first
          content:
            application/json:
              schema:
                type: object
                required: [columns, rankings]
                properties:
                  columns:
                    type: array
                    description: The game's ranking order, without the random tiebreaker
                    items:
                      type: object
                      required: [name, decimals]
                      properties:
                        name: {type: string}
                        decimals: {type: integer}
                  rankings:
                    type: array
                    items:
                      type: object
                      required: [rank, team, rp, played, wins, losses, ties, values]
                      properties:
                        rank: {type: integer}
                        previousRank: {type: integer}
                        team: {type: integer}
                        rp: {type: number}
                        played: {type: integer}
                        wins: {type: integer}
                        losses: {type: integer}
                        ties: {type: integer}
                        disqualifications: {type: integer}
                        values:
                          type: array
                          description: One value per column
                          items: {type: number}
                        stats:
                          type: object
                          additionalProperties: {type: number}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/teams:
    get:
      summary: The teams at the event
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: object
                required: [teams]
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: {type: integer}
                        name: {type: string}
                        nickname: {type: string}
                        city: {type: string}
                        stateProv: {type: string}
                        country: {type: string}
                        schoolName: {type: string}
                        rookieYear: {type: integer}
                        robotName: {type: string}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/alliances:
    get:
      summary: Playoff alliances
      responses:
        "200":
          description: Alliances
          content:
            application/json:
              schema:
                type: object
                required: [alliances]
                properties:
                  alliances:
                    type: array
                    items:
                      type: object
                      required: [number, teams]
                      properties:
                        number: {type: integer}
                        teams: {type: array, items: {type: integer}}
                        lineup: {type: array, items: {type: integer}}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/events:
    get:
      summary: Events after a sequence number
      description: For clients that poll. The server remembers the last 5000 events.
      parameters:
        - name: since
          in: query
          schema: {type: integer, default: 0}
        - $ref: "#/components/parameters/Types"
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 1000}
      responses:
        "200":
          description: Events, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [events, complete, more, lastSeq]
                properties:
                  events:
                    type: array
                    items: {$ref: "#/components/schemas/Event"}
                  complete:
                    type: boolean
                    description: False when events after "since" have already been forgotten
                  more: {type: boolean, description: True when the limit cut the list short}
                  lastSeq: {type: integer}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/events/stream:
    get:
      summary: Live events as Server-Sent Events
      description: >
        Each event has its sequence number as the SSE id and its type as the SSE event name, so EventSource resumes
        after a reconnect. When events could not be delivered (forgotten, or the client fell behind), a
        "stream.gap" event says so: reload state from the read endpoints. A comment line keeps the connection open
        every 15 seconds.
      parameters:
        - name: since
          in: query
          description: Start after this sequence number. Without it (and without Last-Event-ID), only new events.
          schema: {type: integer}
        - name: Last-Event-ID
          in: header
          schema: {type: string}
        - $ref: "#/components/parameters/Types"
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream: {}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/events/ws:
    get:
      summary: Live events over a WebSocket
      description: The same events and gap notices as the SSE stream, one JSON event per text message.
      parameters:
        - name: since
          in: query
          schema: {type: integer}
        - $ref: "#/components/parameters/Types"
      responses:
        "101":
          description: Switching to the WebSocket protocol
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/exports/{file}:
    get:
      summary: Download matches, scores, rankings or the audit log
      description: >
        CSV for spreadsheets or JSON for programs. Columns that depend on the game (breakdown rows, element and
        derived points, ranking points) come from the game each match was played with; in scores.csv they are
        named breakdown.<id>, points.<id> and rp.<id>.
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            enum: [matches.csv, matches.json, scores.csv, scores.json, rankings.csv, rankings.json, audit.csv,
              audit.json]
        - name: type
          in: query
          description: Only matches of this type; every played type when absent. Ignored for rankings.
          schema: {type: string, enum: [practice, qualification, playoff]}
      responses:
        "200":
          description: The export, as an attachment
          content:
            text/csv: {}
            application/json: {}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/journal:
    get:
      summary: The days the event journal has a file for
      description: >
        Every event is also appended to a file, one per day by the clock of the computer the FMS runs on, in a
        folder named journal beside the database. The journal outlives a restart, which the event stream does not.
      responses:
        "200":
          description: The days, newest first
          content:
            application/json:
              schema:
                type: object
                required: [days, keepDays]
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      required: [day, bytes]
                      properties:
                        day: {type: string, format: date}
                        bytes: {type: integer}
                  keepDays: {type: integer, description: Files older than this many days are deleted}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/journal/{day}:
    get:
      summary: The events of one day
      description: >
        One JSON object per line (JSON Lines), in the envelope of the event stream, in the order they happened.
        Sequence numbers begin again each time the FMS starts, which a system.started event marks. A line of type
        journal.gap says that the events between two sequence numbers were lost before they could be written.
      parameters:
        - name: day
          in: path
          required: true
          schema: {type: string, format: date}
      responses:
        "200":
          description: The file of that day, as an attachment
          content:
            application/x-ndjson: {}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/diagnostics/connection/{matchId}/{stationId}:
    get:
      summary: How well a robot stayed connected through a match
      description: >
        Built from the team's match log: packets lost, round-trip times, battery (with brownout risk), radio link
        rates and signal, and every disconnection, with a verdict of good, watch or poor and plain findings. One
        report per time the match was played.
      parameters:
        - name: matchId
          in: path
          required: true
          schema: {type: integer}
        - name: stationId
          in: path
          required: true
          schema: {type: string, examples: [R1, B3]}
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: object
                required: [match, station, team, plays]
                properties:
                  match: {type: string}
                  station: {type: string}
                  team: {type: integer}
                  plays:
                    type: array
                    items:
                      type: object
                      required: [startTime, file, report]
                      properties:
                        startTime: {type: string}
                        file: {type: string, description: Path of the raw CSV log}
                        report:
                          type: object
                          required: [verdict, findings, outages]
                          properties:
                            verdict: {type: string, enum: [good, watch, poor]}
                            findings: {type: array, items: {type: string}}
                            lostPackets: {type: integer}
                            lossPercent: {type: number}
                            robotDownSec: {type: number}
                            outages:
                              type: array
                              items:
                                type: object
                                properties:
                                  link: {type: string, enum: [driver station, robot]}
                                  startSec: {type: number}
                                  endSec: {type: number}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/games:
    get:
      summary: Every game in the games folder, valid or not
      responses:
        "200":
          description: Games
          content:
            application/json:
              schema:
                type: object
                required: [games]
                properties:
                  games:
                    type: array
                    items:
                      type: object
                      required: [id, name, valid, diagnostics]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        description: {type: string}
                        valid: {type: boolean}
                        hash: {type: string}
                        diagnostics:
                          type: array
                          items: {$ref: "#/components/schemas/Diagnostic"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/games/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, pattern: "^[a-z][a-z0-9-]{0,39}$"}
    get:
      summary: One game's definition
      responses:
        "200":
          description: The game
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GameDocument"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      summary: Save a game definition
      description: Requires the admin login while an admin password is set. Nothing is written if it has errors.
      requestBody:
        required: true
        content:
          text/plain:
            schema: {type: string, description: The game definition YAML}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GameDocument"}
        "307":
          description: Redirect to the login page
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422":
          description: The definition has errors; nothing was written
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GameDocument"}
  /api/v1/games/validate:
    post:
      summary: Check a game definition without saving it
      requestBody:
        required: true
        content:
          text/plain:
            schema: {type: string}
      responses:
        "200":
          description: The result of the check
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GameDocument"}
        "401": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
  /api/v1/games/score:
    post:
      summary: Score a raw state with a game, in a sandbox
      description: The test-match sandbox behind the game editor. Nothing on the field changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string, description: A saved game; or give yaml instead}
                yaml: {type: string}
                state:
                  type: object
                  description: The compact state form described in docs/game-definition.md (Worked examples)
                params:
                  type: object
                  additionalProperties: {type: number}
                playoff: {type: boolean}
                clock:
                  type: object
                  properties:
                    phase: {type: string}
                    elapsed: {type: number}
      responses:
        "200":
          description: The computed result, live values and raw state
          content:
            application/json:
              schema:
                type: object
                required: [result, live, state]
                properties:
                  result: {type: object}
                  live: {type: object}
                  state: {type: object}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /api/v1/devices/ws:
    get:
      summary: The WebSocket connection of a field device
      description: >
        For field devices, not for API clients. JSON text frames, starting with a hello that carries the id and the
        token of the device. The messages are in docs/devices.md (WebSocket).
      security:
        - {}
      responses:
        "101": {description: Switching to the WebSocket protocol}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/devices/{id}/manifest:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    put:
      summary: A field device announces or updates its manifest
      description: For field devices that cannot hold a connection open. See docs/devices.md (HTTP).
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: The manifest described in docs/devices.md}
      responses:
        "200":
          description: The manifest was taken
          content:
            application/json:
              schema:
                type: object
                required: [approved]
                properties:
                  approved: {type: boolean, description: False while the device waits for approval}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/devices/{id}/in/{ch}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
      - name: ch
        in: path
        required: true
        description: The id of one of the input channels of the device
        schema: {type: string}
    post:
      summary: A field device reports one input
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [v]
              properties:
                v: {description: The value; a number, or text for a text channel}
                seq: {type: integer}
                conf: {type: number, description: Confidence from 0 to 1}
                ts: {type: integer}
      responses:
        "204": {description: The input was taken}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/devices/{id}/out:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      summary: A field device asks what its outputs should show
      description: >
        Answers at once when since is missing or is not the current number of the device; otherwise waits up to wait
        seconds for a change.
      security:
        - deviceToken: []
      parameters:
        - name: since
          in: query
          description: The seq of the last answer the device has
          schema: {type: integer}
        - name: wait
          in: query
          description: Seconds to wait for a change, at most 60
          schema: {type: integer, minimum: 0, maximum: 60}
      responses:
        "200":
          description: Every output in force; a channel missing from outputs is off
          content:
            application/json:
              schema:
                type: object
                required: [seq, outputs]
                properties:
                  seq: {type: integer}
                  outputs:
                    type: object
                    description: Channel id to output command (docs/devices.md)
                    additionalProperties: {type: object}
                  commands:
                    type: array
                    items:
                      type: object
                      properties:
                        do: {type: string, enum: [identify, reboot]}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/webhooks:
    get:
      summary: The webhooks, without their secrets
      description: Admin only, like every webhook route. Receivers are described in docs/webhooks.md.
      responses:
        "200":
          description: The webhooks, and what a webhook can subscribe to
          content:
            application/json:
              schema:
                type: object
                required: [webhooks, outboxDepth, eventTypes, defaultEvents]
                properties:
                  webhooks:
                    type: array
                    items: {$ref: "#/components/schemas/Webhook"}
                  outboxDepth: {type: integer, description: Deliveries waiting to be sent, over all webhooks}
                  eventTypes:
                    type: array
                    items:
                      type: object
                      required: [type, group, description]
                      properties:
                        type: {type: string}
                        group: {type: string}
                        description: {type: string}
                        default: {type: boolean, description: Chosen for a new webhook}
                        highRate: {type: boolean, description: Can come many times a second}
                        planned: {type: boolean, description: Not published yet}
                  defaultEvents:
                    type: array
                    items: {type: string}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      summary: Add a webhook
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebhookChanges"}
      responses:
        "201":
          description: The new webhook, with its secret
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Webhook"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /api/v1/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      summary: One webhook, with its secret
      responses:
        "200":
          description: The webhook
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Webhook"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      summary: Change a webhook
      description: Fields left out keep their value. Deliveries already waiting go to the new URL with the new secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebhookChanges"}
      responses:
        "200":
          description: The webhook as it is now
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Webhook"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete a webhook, its outbox and its delivery log
      responses:
        "204": {description: Deleted}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/webhooks/{id}/secret:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    post:
      summary: Give a webhook a new random secret
      description: Deliveries already waiting are signed with it from their next attempt.
      responses:
        "200":
          description: The webhook, with its new secret
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Webhook"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/webhooks/{id}/test:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    post:
      summary: Send a test delivery
      description: An event of type webhook.test, sent even while the webhook is disabled.
      responses:
        "202":
          description: The delivery, queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebhookDelivery"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/webhooks/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      summary: The delivery log of a webhook, newest first
      parameters:
        - name: status
          in: query
          description: Only deliveries with this status
          schema: {type: string, enum: [pending, succeeded, failed]}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 50}
      responses:
        "200":
          description: A page of the log
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, total]
                properties:
                  deliveries:
                    type: array
                    items: {$ref: "#/components/schemas/WebhookDelivery"}
                  total: {type: integer, description: How many deliveries match in all}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/webhooks/{id}/deliveries/{deliveryId}/resend:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
      - name: deliveryId
        in: path
        required: true
        description: The id of the delivery, as in the X-Galaxia-Delivery header
        schema: {type: string}
    post:
      summary: Send a delivery again
      description: >
        With the same id and body, signed with a new timestamp, and retried for another 24 hours if it fails. It is
        sent even while the webhook is disabled.
      responses:
        "202":
          description: The delivery, queued again
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WebhookDelivery"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: An API token made on Setup, Users and API Tokens. It carries a role.
    session:
      type: apiKey
      in: cookie
      name: session_token
      description: The cookie set by logging in on /login.
    deviceToken:
      type: http
      scheme: bearer
      description: The own token of a field device (docs/devices.md), only for the routes under /devices.
  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      description: The id of the device
      schema: {type: string}
    WebhookId:
      name: id
      in: path
      required: true
      schema: {type: integer}
    Types:
      name: types
      in: query
      description: Comma-separated event type prefixes, such as "match,score.changed". Empty means every event.
      schema: {type: string}
  responses:
    Error:
      description: An error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
              diagnostics:
                type: array
                items: {$ref: "#/components/schemas/Diagnostic"}
  schemas:
    Role:
      type: string
      enum: [admin, scorer, referee, read-only]
    Webhook:
      type: object
      required: [id, name, url, events, enabled, createdAt, updatedAt, pending, lastDelivery]
      properties:
        id: {type: integer}
        name: {type: string}
        url: {type: string}
        events:
          type: array
          description: Event types or prefixes; "*" alone is every event
          items: {type: string}
        enabled: {type: boolean}
        secret: {type: string, description: Only in answers about one webhook}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        pending: {type: integer, description: Deliveries waiting to be sent}
        lastDelivery:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/WebhookDelivery"
    WebhookChanges:
      type: object
      description: >
        What to set. On a new webhook, url is required; name defaults to the host of the URL, events to the default
        selection, enabled to true and secret to a new random one.
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 100}
        url: {type: string, description: An http or https address, maxLength: 2000}
        events:
          type: array
          maxItems: 50
          items: {type: string}
        enabled: {type: boolean}
        secret: {type: string, minLength: 16, maxLength: 200}
    WebhookDelivery:
      type: object
      required: [id, webhook, event, seq, status, manual, attempts, createdAt, responseCode, latencyMs, error, history]
      properties:
        id: {type: string, description: The X-Galaxia-Delivery header}
        webhook: {type: integer}
        event: {type: string}
        seq: {type: integer, description: "The sequence number of the event, or 0 for a test"}
        status: {type: string, enum: [pending, sending, succeeded, failed]}
        manual: {type: boolean, description: A test or a resend}
        attempts: {type: integer}
        createdAt: {type: string, format: date-time}
        lastAttemptAt: {type: [string, "null"], format: date-time}
        nextAttemptAt: {type: [string, "null"], format: date-time}
        deadline: {type: [string, "null"], format: date-time, description: When retrying stops}
        responseCode: {type: integer, description: The last HTTP status, or 0 when there was no answer}
        latencyMs: {type: integer}
        error: {type: string}
        responseBody: {type: string, description: The start of the last answer of the receiver}
        body: {type: string, description: The JSON that is sent}
        history:
          type: array
          items:
            type: object
            required: [time, responseCode, latencyMs, error]
            properties:
              time: {type: string, format: date-time}
              responseCode: {type: integer}
              latencyMs: {type: integer}
              error: {type: string}
    MatchState:
      type: string
      description: >-
        countdown is the time between Start being pressed and the match beginning; a match without a countdown
        passes through it in a moment.
      enum: [pre_match, countdown, in_match, post_match, timeout, post_timeout, unknown]
    MatchSummary:
      type: object
      required: [id, type, typeOrder, shortName, longName, status, teams]
      properties:
        id: {type: integer}
        type: {type: string, enum: [Test, Practice, Qualification, Playoff]}
        typeOrder: {type: integer}
        shortName: {type: string}
        longName: {type: string}
        time: {type: string, format: date-time}
        startedAt: {type: [string, "null"], format: date-time}
        status: {type: string, enum: [scheduled, hidden, complete, unknown]}
        teams:
          type: object
          description: Alliance id to team numbers by robot position, zero where empty
          additionalProperties:
            type: array
            items: {type: integer}
        result:
          oneOf:
            - type: "null"
            - type: object
              required: [gameId, winner, scores]
              properties:
                gameId: {type: string}
                playNumber: {type: integer}
                winner: {type: string, description: Alliance id, or empty for a tie}
                tiebreak: {type: string}
                scores:
                  type: object
                  additionalProperties: {type: number}
    ScoreChange:
      type: object
      required: [seq, time, element, op, source]
      properties:
        seq: {type: integer}
        time: {type: string, format: date-time}
        phase: {type: string}
        match_time: {type: number}
        alliance: {type: string}
        robot: {type: integer}
        element: {type: string}
        op: {type: string}
        value: {}
        rule: {type: string}
        bucket: {type: string}
        reverts: {type: integer}
        source:
          type: object
          required: [kind]
          properties:
            kind: {type: string, enum: [device, scorer, referee, admin, rule, api]}
            id: {type: string}
            name: {type: string}
            confidence: {type: number}
    Event:
      type: object
      required: [seq, time, type]
      properties:
        seq: {type: integer, description: Zero for stream notices such as stream.gap}
        time: {type: string, format: date-time}
        type: {type: string, description: "Dotted, most general first: match.phase_changed, score.changed, device.online"}
        match: {type: string}
        run: {type: string}
        data: {}
    GameView:
      type: object
      required: [id, name, alliances, stations, phases, elements]
      properties:
        id: {type: string}
        name: {type: string}
        hash: {type: string}
        allianceSize: {type: integer}
        alliances:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              short: {type: string}
              color: {type: string}
              ds: {type: string}
        stations: {type: array, items: {type: string}}
        phases: {type: array, items: {type: object}}
        elements: {type: array, items: {type: object}}
      additionalProperties: true
    GameDocument:
      type: object
      required: [id, yaml, valid, diagnostics]
      properties:
        id: {type: string}
        yaml: {type: string}
        valid: {type: boolean}
        saved: {type: boolean}
        diagnostics:
          type: array
          items: {$ref: "#/components/schemas/Diagnostic"}
        view:
          oneOf:
            - type: "null"
            - {$ref: "#/components/schemas/GameView"}
    Diagnostic:
      type: object
      required: [severity, message]
      properties:
        severity: {type: string, enum: [error, warning]}
        path: {type: string}
        line: {type: integer}
        column: {type: integer}
        message: {type: string}
