<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" width="760" height="464" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Beam-break counter</title>
<rect width="760" height="464" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#263238">Beam-break counter</text>
<path d="M220 120 L300 120 L300 120 L500 120" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="120" r="4" fill="#d32f2f"/>
<circle cx="500" cy="120" r="4" fill="#d32f2f"/>
<path d="M220 150 L300 150 L300 150 L500 150" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="150" r="4" fill="#212121"/>
<circle cx="500" cy="150" r="4" fill="#212121"/>
<path d="M220 180 L300 180 L300 180 L500 180" fill="none" stroke="#f9a825" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="180" r="4" fill="#f9a825"/>
<circle cx="500" cy="180" r="4" fill="#f9a825"/>
<path d="M220 120 L420 120 L420 300 L500 300" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="120" r="4" fill="#d32f2f"/>
<circle cx="500" cy="300" r="4" fill="#d32f2f"/>
<path d="M220 150 L450 150 L450 330 L500 330" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="150" r="4" fill="#212121"/>
<circle cx="500" cy="330" r="4" fill="#212121"/>
<rect x="30" y="60" width="190" height="160" rx="10" fill="#1f2a44" stroke="#90a4ae" stroke-width="1.5"/>
<text x="125" y="84" text-anchor="middle" font-weight="bold" fill="#ffffff">ESP32 DevKit</text>
<text x="125" y="100" text-anchor="middle" font-size="11" fill="#ffffff">esp32dev</text>
<rect x="215" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="124" text-anchor="end" fill="#ffffff">3V3</text>
<rect x="215" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="154" text-anchor="end" fill="#ffffff">GND</text>
<rect x="215" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="184" text-anchor="end" fill="#ffffff">GPIO 27</text>
<rect x="500" y="60" width="200" height="160" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<text x="600" y="84" text-anchor="middle" font-weight="bold" fill="#263238">IR break-beam receiver</text>
<text x="600" y="100" text-anchor="middle" font-size="11" fill="#263238">3 wires</text>
<rect x="495" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="510" y="124" fill="#263238">red: +</text>
<rect x="495" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="510" y="154" fill="#263238">black: GND</text>
<rect x="495" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="510" y="184" fill="#263238">white: signal</text>
<rect x="500" y="240" width="200" height="130" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<text x="600" y="264" text-anchor="middle" font-weight="bold" fill="#263238">IR break-beam emitter</text>
<text x="600" y="280" text-anchor="middle" font-size="11" fill="#263238">2 wires</text>
<rect x="495" y="295" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="510" y="304" fill="#263238">red: +</text>
<rect x="495" y="325" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="510" y="334" fill="#263238">black: GND</text>
<text x="20" y="400" font-size="12" fill="#37474f">The receiver&#x27;s output is open-collector: the ESP32&#x27;s internal pull-up (INPUT_PULLUP) is all it needs.</text>
<text x="20" y="418" font-size="12" fill="#37474f">Aim the emitter at the receiver across the goal opening. Both work from 3.3 V to 5 V.</text>
<text x="20" y="436" font-size="12" fill="#37474f">Pico W: + to 3V3(OUT) (pin 36), GND to any GND, signal to GP15 (pin 20).</text>
</svg>
