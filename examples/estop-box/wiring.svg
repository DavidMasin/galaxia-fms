<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>E-stop box (normally closed, safety channel)</title>
<rect width="760" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#263238">E-stop box (normally closed, safety channel)</text>
<path d="M220 120 L300 120 L300 120 L480 120" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="120" r="4" fill="#212121"/>
<circle cx="480" cy="120" r="4" fill="#212121"/>
<path d="M220 150 L300 150 L300 150 L480 150" fill="none" stroke="#c2185b" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="150" r="4" fill="#c2185b"/>
<circle cx="480" cy="150" r="4" fill="#c2185b"/>
<rect x="30" y="60" width="190" height="130" rx="10" fill="#1f2a44" stroke="#90a4ae" stroke-width="1.5"/>
<text x="125" y="84" text-anchor="middle" font-weight="bold" fill="#ffffff">ESP32 DevKit</text>
<text x="125" y="100" text-anchor="middle" font-size="11" fill="#ffffff">esp32dev</text>
<rect x="215" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="124" text-anchor="end" fill="#ffffff">GND</text>
<rect x="215" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="154" text-anchor="end" fill="#ffffff">GPIO 25</text>
<rect x="480" y="60" width="200" height="130" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<text x="580" y="84" text-anchor="middle" font-weight="bold" fill="#263238">Mushroom E-stop</text>
<text x="580" y="100" text-anchor="middle" font-size="11" fill="#263238">NC contact block (red)</text>
<rect x="475" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="124" fill="#263238">NC terminal 1</text>
<rect x="475" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="154" fill="#263238">NC terminal 2</text>
<text x="20" y="220" font-size="12" fill="#37474f">Released: the NC contact is closed, GPIO 25 reads low, the channel reports 1 (safe).</text>
<text x="20" y="238" font-size="12" fill="#37474f">Pressed, a cut wire or a loose terminal: the circuit opens, the pull-up wins, the channel reports 0 (stop).</text>
<text x="20" y="256" font-size="12" fill="#37474f">A wireless E-stop must never be the only E-stop path. The driver station E-stops and the</text>
<text x="20" y="274" font-size="12" fill="#37474f">wired field stops stay the primary stops; this box is a convenience on top of them.</text>
<text x="20" y="292" font-size="12" fill="#37474f">Pico W: NC terminal 1 to GND, NC terminal 2 to GP16 (pin 21).</text>
</svg>
