<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Limit switch</title>
<rect width="760" height="284" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#263238">Limit switch</text>
<path d="M220 120 L300 120 L300 120 L480 120" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="120" r="4" fill="#212121"/>
<circle cx="480" cy="120" r="4" fill="#212121"/>
<path d="M220 150 L300 150 L300 150 L480 150" fill="none" stroke="#f9a825" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="150" r="4" fill="#f9a825"/>
<circle cx="480" cy="150" r="4" fill="#f9a825"/>
<rect x="30" y="60" width="190" height="130" rx="10" fill="#1f2a44" stroke="#90a4ae" stroke-width="1.5"/>
<text x="125" y="84" text-anchor="middle" font-weight="bold" fill="#ffffff">ESP32 DevKit</text>
<text x="125" y="100" text-anchor="middle" font-size="11" fill="#ffffff">esp32dev</text>
<rect x="215" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="124" text-anchor="end" fill="#ffffff">GND</text>
<rect x="215" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="154" text-anchor="end" fill="#ffffff">GPIO 26</text>
<rect x="480" y="60" width="200" height="130" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<text x="580" y="84" text-anchor="middle" font-weight="bold" fill="#263238">Limit switch</text>
<text x="580" y="100" text-anchor="middle" font-size="11" fill="#263238">roller lever microswitch</text>
<rect x="475" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="124" fill="#263238">COM</text>
<rect x="475" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="154" fill="#263238">NO</text>
<text x="20" y="220" font-size="12" fill="#37474f">Leave NC unconnected. Pressed: the switch connects GPIO 26 to ground and the device reports 1.</text>
<text x="20" y="238" font-size="12" fill="#37474f">Use twisted or shielded wire for long runs across the field; the SDK debounces for 30 ms.</text>
<text x="20" y="256" font-size="12" fill="#37474f">Pico W: COM to GND, NO to GP13 (pin 17).</text>
</svg>
