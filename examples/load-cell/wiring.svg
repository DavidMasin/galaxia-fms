<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 326" width="800" height="326" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Load cell with an HX711</title>
<rect width="800" height="326" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#263238">Load cell with an HX711</text>
<path d="M220 120 L260 120 L260 120 L300 120" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="120" r="4" fill="#d32f2f"/>
<circle cx="300" cy="120" r="4" fill="#d32f2f"/>
<path d="M220 150 L260 150 L260 150 L300 150" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="150" r="4" fill="#212121"/>
<circle cx="300" cy="150" r="4" fill="#212121"/>
<path d="M220 180 L260 180 L260 180 L300 180" fill="none" stroke="#f9a825" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="180" r="4" fill="#f9a825"/>
<circle cx="300" cy="180" r="4" fill="#f9a825"/>
<path d="M220 210 L260 210 L260 210 L300 210" fill="none" stroke="#1e88e5" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="210" r="4" fill="#1e88e5"/>
<circle cx="300" cy="210" r="4" fill="#1e88e5"/>
<path d="M500 120 L550 120 L550 120 L600 120" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linejoin="round"/>
<circle cx="500" cy="120" r="4" fill="#d32f2f"/>
<circle cx="600" cy="120" r="4" fill="#d32f2f"/>
<path d="M500 150 L550 150 L550 150 L600 150" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
<circle cx="500" cy="150" r="4" fill="#212121"/>
<circle cx="600" cy="150" r="4" fill="#212121"/>
<path d="M500 180 L550 180 L550 180 L600 180" fill="none" stroke="#6d4c41" stroke-width="3" stroke-linejoin="round"/>
<circle cx="500" cy="180" r="4" fill="#6d4c41"/>
<circle cx="600" cy="180" r="4" fill="#6d4c41"/>
<path d="M500 210 L550 210 L550 210 L600 210" fill="none" stroke="#43a047" stroke-width="3" stroke-linejoin="round"/>
<circle cx="500" cy="210" r="4" fill="#43a047"/>
<circle cx="600" cy="210" r="4" fill="#43a047"/>
<rect x="30" y="60" width="190" height="190" rx="10" fill="#1f2a44" stroke="#90a4ae" stroke-width="1.5"/>
<text x="125" y="84" text-anchor="middle" font-weight="bold" fill="#ffffff">ESP32 DevKit</text>
<text x="125" y="100" text-anchor="middle" font-size="11" fill="#ffffff">esp32dev</text>
<rect x="215" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="124" text-anchor="end" fill="#ffffff">3V3</text>
<rect x="215" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="154" text-anchor="end" fill="#ffffff">GND</text>
<rect x="215" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="184" text-anchor="end" fill="#ffffff">GPIO 32</text>
<rect x="215" y="205" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="214" text-anchor="end" fill="#ffffff">GPIO 33</text>
<rect x="300" y="60" width="200" height="190" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<text x="400" y="84" text-anchor="middle" font-weight="bold" fill="#263238">HX711 module</text>
<text x="400" y="100" text-anchor="middle" font-size="11" fill="#263238">24-bit load cell amplifier</text>
<rect x="295" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="310" y="124" fill="#263238">VCC</text>
<rect x="295" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="310" y="154" fill="#263238">GND</text>
<rect x="295" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="310" y="184" fill="#263238">DT</text>
<rect x="295" y="205" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="310" y="214" fill="#263238">SCK</text>
<rect x="495" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="124" text-anchor="end" fill="#263238">E+</text>
<rect x="495" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="154" text-anchor="end" fill="#263238">E-</text>
<rect x="495" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="184" text-anchor="end" fill="#263238">A-</text>
<rect x="495" y="205" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="214" text-anchor="end" fill="#263238">A+</text>
<rect x="600" y="60" width="180" height="190" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<text x="690" y="84" text-anchor="middle" font-weight="bold" fill="#263238">Load cell</text>
<text x="690" y="100" text-anchor="middle" font-size="11" fill="#263238">4-wire bar, e.g. 20 kg</text>
<rect x="595" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="610" y="124" fill="#263238">red (E+)</text>
<rect x="595" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="610" y="154" fill="#263238">black (E-)</text>
<rect x="595" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="610" y="184" fill="#263238">white (A-)</text>
<rect x="595" y="205" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="610" y="214" fill="#263238">green (A+)</text>
<text x="20" y="280" font-size="12" fill="#37474f">Wire colours vary between load cells: check the data sheet. Swapping A- and A+ only flips the sign.</text>
<text x="20" y="298" font-size="12" fill="#37474f">Mount the cell between a base and a platform so the load bends it (follow the arrow on the bar).</text>
</svg>
