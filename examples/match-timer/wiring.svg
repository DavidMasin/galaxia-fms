<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" width="760" height="374" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>LED matrix match timer (MAX7219)</title>
<rect width="760" height="374" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#263238">LED matrix match timer (MAX7219)</text>
<path d="M220 120 L300 120 L300 120 L500 120" fill="none" stroke="#e65100" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="120" r="4" fill="#e65100"/>
<circle cx="500" cy="120" r="4" fill="#e65100"/>
<path d="M220 150 L300 150 L300 150 L500 150" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="150" r="4" fill="#212121"/>
<circle cx="500" cy="150" r="4" fill="#212121"/>
<path d="M220 180 L300 180 L300 180 L500 180" fill="none" stroke="#f9a825" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="180" r="4" fill="#f9a825"/>
<circle cx="500" cy="180" r="4" fill="#f9a825"/>
<path d="M220 210 L300 210 L300 210 L500 210" fill="none" stroke="#1e88e5" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="210" r="4" fill="#1e88e5"/>
<circle cx="500" cy="210" r="4" fill="#1e88e5"/>
<path d="M220 240 L300 240 L300 240 L500 240" fill="none" stroke="#43a047" stroke-width="3" stroke-linejoin="round"/>
<circle cx="220" cy="240" r="4" fill="#43a047"/>
<circle cx="500" cy="240" r="4" fill="#43a047"/>
<rect x="30" y="60" width="190" height="220" rx="10" fill="#1f2a44" stroke="#90a4ae" stroke-width="1.5"/>
<text x="125" y="84" text-anchor="middle" font-weight="bold" fill="#ffffff">ESP32 DevKit</text>
<text x="125" y="100" text-anchor="middle" font-size="11" fill="#ffffff">esp32dev</text>
<rect x="215" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="124" text-anchor="end" fill="#ffffff">VIN (5 V)</text>
<rect x="215" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="154" text-anchor="end" fill="#ffffff">GND</text>
<rect x="215" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="184" text-anchor="end" fill="#ffffff">GPIO 23 (MOSI)</text>
<rect x="215" y="205" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="214" text-anchor="end" fill="#ffffff">GPIO 5</text>
<rect x="215" y="235" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="244" text-anchor="end" fill="#ffffff">GPIO 18 (SCK)</text>
<rect x="500" y="60" width="210" height="220" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<text x="605" y="84" text-anchor="middle" font-weight="bold" fill="#263238">MAX7219 4-in-1 matrix</text>
<text x="605" y="100" text-anchor="middle" font-size="11" fill="#263238">FC-16 module, 32 x 8</text>
<rect x="495" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="510" y="124" fill="#263238">VCC</text>
<rect x="495" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="510" y="154" fill="#263238">GND</text>
<rect x="495" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="510" y="184" fill="#263238">DIN</text>
<rect x="495" y="205" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="510" y="214" fill="#263238">CS</text>
<rect x="495" y="235" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="510" y="244" fill="#263238">CLK</text>
<text x="20" y="310" font-size="12" fill="#37474f">The module runs on 5 V: power the ESP32 from USB and take 5 V from its VIN pin (or use one 5 V supply).</text>
<text x="20" y="328" font-size="12" fill="#37474f">The MAX7219 usually accepts the ESP32&#x27;s 3.3 V signals; if the display shows garbage,</text>
<text x="20" y="346" font-size="12" fill="#37474f">put a 74AHCT125 level shifter in DIN, CS and CLK.</text>
</svg>
