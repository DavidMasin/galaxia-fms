; Build and flash with: pio run -t upload    (then watch with: pio device monitor)
; The Galaxia library is taken from this repository; outside it, use lib_deps = Galaxia from a copy of sdk/arduino.

[platformio]
src_dir = arduino/stack_light

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  symlink://../../sdk/arduino
