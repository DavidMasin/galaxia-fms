<text x="210" y="154" text-anchor="end" fill="#ffffff">GND</text>
<rect x="215" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="184" text-anchor="end" fill="#ffffff">GPIO 16</text>
<rect x="215" y="205" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="214" text-anchor="end" fill="#ffffff">GPIO 17</text>
<rect x="215" y="235" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="244" text-anchor="end" fill="#ffffff">GPIO 18</text>
<rect x="215" y="265" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="210" y="274" text-anchor="end" fill="#ffffff">GPIO 19</text>
<rect x="300" y="60" width="200" height="250" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<text x="400" y="84" text-anchor="middle" font-weight="bold" fill="#263238">4-channel relay board</text>
<text x="400" y="100" text-anchor="middle" font-size="11" fill="#263238">inputs active low</text>
<rect x="295" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="310" y="124" fill="#263238">VCC</text>
<rect x="295" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="310" y="154" fill="#263238">GND</text>
<rect x="295" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="310" y="184" fill="#263238">IN1</text>
<rect x="295" y="205" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="310" y="214" fill="#263238">IN2</text>
<rect x="295" y="235" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="310" y="244" fill="#263238">IN3</text>
<rect x="295" y="265" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="310" y="274" fill="#263238">IN4</text>
<rect x="495" y="115" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="124" text-anchor="end" fill="#263238">COM1-4</text>
<rect x="495" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="154" text-anchor="end" fill="#263238">NO1</text>
<rect x="495" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="184" text-anchor="end" fill="#263238">NO2</text>
<rect x="495" y="205" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="214" text-anchor="end" fill="#263238">NO3</text>
<rect x="495" y="235" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="244" text-anchor="end" fill="#263238">NO4</text>
<rect x="610" y="60" width="170" height="250" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<text x="695" y="84" text-anchor="middle" font-weight="bold" fill="#263238">Stack light</text>
<text x="695" y="100" text-anchor="middle" font-size="11" fill="#263238">12 V DC, with buzzer</text>
<rect x="605" y="145" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="620" y="154" fill="#263238">red</text>
<rect x="605" y="175" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="620" y="184" fill="#263238">amber</text>
<rect x="605" y="205" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="620" y="214" fill="#263238">green</text>
<rect x="605" y="235" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="620" y="244" fill="#263238">buzzer</text>
<rect x="605" y="265" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="620" y="274" fill="#263238">common (-)</text>
<rect x="300" y="330" width="200" height="130" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
<text x="400" y="354" text-anchor="middle" font-weight="bold" fill="#263238">12 V DC supply</text>
<rect x="495" y="385" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="394" text-anchor="end" fill="#263238">+12 V</text>
<rect x="495" y="415" width="10" height="10" fill="#cfd8dc" stroke="#546e7a"/>
<text x="490" y="424" text-anchor="end" fill="#263238">- (0 V)</text>
<text x="20" y="490" font-size="12" fill="#37474f">COM1 to COM4 are joined and fed from +12 V; each NO contact switches one lamp of the stack light.</text>
<text x="20" y="508" font-size="12" fill="#37474f">Use a 12 or 24 V DC stack light. Never switch mains voltage with a hobby relay board on the field.</text>
<text x="20" y="526" font-size="12" fill="#37474f">If the relays do not click from 3.3 V, remove the JD-VCC jumper and feed JD-VCC from 5 V (VIN).</text>
<text x="20" y="544" font-size="12" fill="#37474f">Pico W: VCC to 3V3(OUT), IN1 to IN4 on GP16, GP17, GP18, GP19.</text>
</svg>
