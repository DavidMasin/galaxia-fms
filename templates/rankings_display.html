<!DOCTYPE html>
<html>
  <head>
    <title>Standings Display - {{.EventSettings.Name}} - Galaxia FMS </title>
    <link rel="shortcut icon" href="/static/img/favicon.ico">
    <link rel="stylesheet" href="/static/css/lib/bootstrap.min.css"/>
    <link rel="stylesheet" href="/static/css/cheesy-arena.css"/>
    <link rel="stylesheet" href="/static/css/rankings_display.css"/>
  </head>
  <body>
    <div id="column">
      <div id="titlebar" class="row justify-content-between">
        <div class="col-lg-4 text-start">Team Standings</div>
        <div class="col-lg-4 text-end">{{.EventSettings.Name}}</div>
      </div>
      <div id="standings">
        <table id="header"></table>
        <div id="container">
          <div id="scroller">
            <table id="rankings1" class="table table-striped rankings-table"></table>
            <table id="rankings2" class="table table-striped rankings-table"></table>
          </div>
        </div>
        <div id="footer">
          <span id="highestPlayedMatch"></span>
        </div>
      </div>
      <div id="earlyLateMessage"></div>
    </div>
    <script src="/static/js/lib/jquery.min.js"></script>
    <script src="/static/js/lib/jquery.json-2.4.min.js"></script>
    <script src="/static/js/lib/jquery.websocket-0.0.1.js"></script>
    <script src="/static/js/lib/jquery.transit.min.js"></script>
    <script src="/static/js/cheesy-websocket.js"></script>
    <script src="/static/js/game_view.js"></script>
    <script src="/static/js/display_shared.js"></script>
    <script src="/static/js/rankings_display.js"></script>
  </body>
</html>
