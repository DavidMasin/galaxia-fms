{{define "referee_panel_foul_list"}}
{{range $foul := .Fouls}}
<div class="foul" data-alliance-index="{{$foul.AllianceIndex}}" data-foul-id="{{$foul.ID}}">
  <div>{{$foul.Number}}</div>
  <select class="type-select"
    onchange="updateFoul('{{$foul.AllianceId}}', {{$foul.ID}}, {type: this.value});">
    {{range $type := $foul.Types}}
    <option value="{{$type.Id}}"{{if $type.Selected}} selected{{end}}>{{$type.Name | html}}</option>
    {{end}}
  </select>
  <div class="team-buttons">
    {{range $team := $foul.Teams}}
    <div class="team-button"{{if $team.Selected}} data-selected="true"{{end}}
      onclick="updateFoul('{{$foul.AllianceId}}', {{$foul.ID}}, {robot: {{if $team.Selected}}0{{else}}{{$team.Position}}{{end}}});">
      {{if $team.TeamId}}{{$team.TeamId}}{{else}}#{{$team.Position}}{{end}}
    </div>
    {{end}}
  </div>
  <select class="rule-select"
    onchange="updateFoul('{{$foul.AllianceId}}', {{$foul.ID}}, {rule: this.value});">
    <option value=""{{if not $foul.Rule}} selected{{end}}>No Rule Selected</option>
    {{range $rule := $foul.Rules}}
    <option value="{{$rule.Id}}"{{if $rule.Selected}} selected{{end}} title="{{$rule.Text | html}}">
      {{$rule.Id}} [{{$foul.TypeName | html}}]: {{$rule.Name | html}}
    </option>
    {{end}}
  </select>
  <div class="delete-button" onclick="removeFoul('{{$foul.AllianceId}}', {{$foul.ID}});">Delete</div>
</div>
{{end}}
{{end}}
